<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KnowledgeLink — Connection Error</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0A0F1E;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      gap: 16px;
    }
    img { width: 72px; height: 72px; border-radius: 16px; opacity: 0.85; }
    h1 { font-size: 22px; font-weight: 600; }
    p { font-size: 14px; color: #94a3b8; text-align: center; max-width: 360px; line-height: 1.6; }
    button {
      margin-top: 8px;
      background: #f97316;
      color: white;
      border: none;
      padding: 10px 28px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
    }
    button:hover { background: #ea580c; }
  </style>
</head>
<body>
  <img src="assets/icon.png" alt="KnowledgeLink" />
  <h1>Cannot connect</h1>
  <p>KnowledgeLink couldn't load. Make sure you're connected to the internet and the app is deployed.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
