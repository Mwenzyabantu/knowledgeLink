name: Build Windows App

on:
  push:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Package for Windows
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Normalize lockfile registry URLs
        run: node .github/scripts/normalize-npm-lockfile.cjs

      - name: Install dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Check TypeScript
        run: npm run check

      - name: Prepare desktop configuration
        run: npm run desktop:config

      - name: Build web app and server
        run: npm run build

      - name: Build installer
        run: npx electron-builder --win nsis --publish never

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: KnowledgeLink-Windows-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
